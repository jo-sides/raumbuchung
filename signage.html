<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wegweiser</title>
<style>
  :root {
    --markenrot: #EB003C;
    --markenblau: #000548;
    --markenblau-hell: #6084bf;
    --grau: #f0f0f0;
  }
  * { font-family: 'Maven Johanniter', Tahoma, Arial, sans-serif; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; color: var(--markenblau); height: 100%; overflow: hidden; }
  body { padding: 24px 32px; display: flex; flex-direction: column; }
  #kopfzeile { display: flex; gap: 20px; padding: 0 22px 8px; font-size: 14px; font-weight: 700; color: var(--markenblau-hell); text-transform: uppercase; letter-spacing: 0.5px; }
  #kopfzeile .raum-kopf { min-width: 190px; }
  #inhalt { flex: 1; overflow: hidden; }
  #leer { color: #999; font-size: 22px; text-align: center; margin-top: 18%; }
  .kachel {
    display: flex; align-items: center; gap: 20px;
    background: var(--grau); border-left: 8px solid var(--markenrot);
    border-radius: 10px; padding: 18px 22px; margin-bottom: 16px;
  }
  .kachel.laeuft { background: #e3faf1; border-left-color: #17a877; }
  .raum { font-size: 30px; font-weight: 700; min-width: 190px; color: var(--markenblau); }
  .stock { font-size: 17px; font-weight: 600; color: var(--markenblau-hell); display: block; margin-top: 3px; }
  .info { flex: 1; }
  .titel { font-size: 22px; font-weight: 700; color: var(--markenblau); }
  .zeit { font-size: 18px; font-weight: 500; color: var(--markenblau-hell); margin-top: 2px; }
  .badge { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 5px 14px; border-radius: 20px; background: #17a877; color: #ffffff; }
</style>
</head>
<body>
  <div id="kopfzeile">
    <span class="raum-kopf">Raum</span>
    <span>Veranstaltung</span>
  </div>
  <div id="inhalt"></div>

<script>
const SIGNAGE_URL = "https://raw.githubusercontent.com/jo-sides/raumbuchung/main/signage.json";

function heuteDatum() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function minJetzt() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function minVon(uhrzeit) {
  const [h,m] = uhrzeit.split(':').map(Number);
  return h*60+m;
}

async function laden() {
  try {
    const res = await fetch(SIGNAGE_URL + "?t=" + Date.now());
    const alle = await res.json();
    const heute = heuteDatum();
    const jetzt = minJetzt();
    const termine = alle
      .filter(t => t.datum === heute && minVon(t.bis) > jetzt)
      .sort((a,b) => minVon(a.von) - minVon(b.von));

    const inhalt = document.getElementById('inhalt');
    document.getElementById('kopfzeile').style.display = termine.length ? 'flex' : 'none';
    if (termine.length === 0) {
      inhalt.innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
      return;
    }
    inhalt.innerHTML = termine.map(t => {
      const laeuft = minVon(t.von) <= jetzt && jetzt < minVon(t.bis);
      return `
        <div class="kachel ${laeuft ? 'laeuft' : ''}">
          <div class="raum">${t.kuerzel}<span class="stock">${t.pfeil} ${t.stock}</span></div>
          <div class="info">
            <div class="titel">${t.titel}</div>
            <div class="zeit">${t.von} – ${t.bis} Uhr</div>
          </div>
          ${laeuft ? '<span class="badge">Läuft</span>' : ''}
        </div>`;
    }).join('');

    // Keine halb abgeschnittenen Kacheln: alles entfernen, was über die verfügbare Höhe hinausragt —
    // aber niemals die erste/einzige Kachel, und nur wenn die Höhe plausibel ermittelt werden konnte
    // (bei 0/sehr klein hat die Umgebung z.B. noch nicht fertig geladen — dann lieber nichts abschneiden).
    if (inhalt.clientHeight > 80) {
      const kacheln = Array.from(inhalt.children);
      for (let i = kacheln.length - 1; i > 0; i--) {
        if (kacheln[i].offsetTop + kacheln[i].offsetHeight > inhalt.clientHeight) {
          kacheln[i].remove();
        } else {
          break;
        }
      }
    }
  } catch (e) {
    document.getElementById('inhalt').innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
  }
}

laden();
setInterval(laden, 60000);
</script>
</body>
</html>
