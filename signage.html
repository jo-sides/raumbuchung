<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wegweiser</title>
<style>
  :root {
    --markenrot: #EB003C;
    --markenblau: #000548;
    --markenblau-hell: #6084bf;
    --grau: #f0f0f0;
  }
  * { font-family: 'Maven Johanniter', Tahoma, Arial, sans-serif; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--markenblau); height: 100%; overflow: hidden; }
  body { padding: 3vh 3vw; display: flex; flex-direction: column; }
  #kopfzeile { display: flex; gap: 3vw; padding: 0 2.5vw 1vh; font-size: 2vh; font-weight: 700; color: var(--markenblau-hell); text-transform: uppercase; letter-spacing: 0.5px; }
  #kopfzeile .raum-kopf { min-width: 22vw; }
  #inhalt { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #leer { color: #999; font-size: 3vh; text-align: center; margin-top: 18%; }
  .kachel {
    display: flex; align-items: center; gap: 2.5vw;
    background: var(--grau); border-left: 1vh solid var(--markenrot);
    border-radius: 1.2vh; padding: 2vh 2.5vw; margin-bottom: 2vh; flex-shrink: 0;
  }
  .kachel.laeuft { background: #e3faf1; border-left-color: #17a877; }
  .raum { font-size: 4vh; font-weight: 700; min-width: 22vw; color: var(--markenblau); }
  .stock { font-size: 2.2vh; font-weight: 600; color: var(--markenblau-hell); display: block; margin-top: 0.3vh; }
  .info { flex: 1; }
  .titel { font-size: 2.8vh; font-weight: 700; color: var(--markenblau); }
  .zeit { font-size: 2.3vh; font-weight: 500; color: var(--markenblau-hell); margin-top: 0.3vh; }
  .badge { font-size: 1.8vh; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.6vh 1.8vh; border-radius: 20px; background: #17a877; color: #ffffff; flex-shrink: 0; }
  #mehr { font-size: 2vh; color: var(--markenblau-hell); text-align: center; padding: 0.8vh; font-weight: 600; }
</style>
</head>
<body>
  <div id="kopfzeile">
    <span class="raum-kopf">Raum</span>
    <span>Veranstaltung</span>
  </div>
  <div id="inhalt"></div>

<script>
const SIGNAGE_URL = "https://raw.githubusercontent.com/jo-sides/raumbuchung/main/signage.json";

function heuteDatum() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function minJetzt() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function minVon(uhrzeit) {
  const [h,m] = uhrzeit.split(':').map(Number);
  return h*60+m;
}

async function laden() {
  try {
    const res = await fetch(SIGNAGE_URL + "?t=" + Date.now());
    const alle = await res.json();
    const heute = heuteDatum();
    const jetzt = minJetzt();
    const alleTermine = alle
      .filter(t => t.datum === heute && minVon(t.bis) > jetzt)
      .sort((a,b) => minVon(a.von) - minVon(b.von));

    const MAX_KACHELN = 3; // fest statt gemessen — zuverlässig unabhängig von der iframe-Einbettung
    const termine = alleTermine.slice(0, MAX_KACHELN);
    const rest = alleTermine.length - termine.length;

    const inhalt = document.getElementById('inhalt');
    document.getElementById('kopfzeile').style.display = termine.length ? 'flex' : 'none';
    if (termine.length === 0) {
      inhalt.innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
      return;
    }
    inhalt.innerHTML = termine.map(t => {
      const laeuft = minVon(t.von) <= jetzt && jetzt < minVon(t.bis);
      return `
        <div class="kachel ${laeuft ? 'laeuft' : ''}">
          <div class="raum">${t.kuerzel}<span class="stock">${t.pfeil} ${t.stock}</span></div>
          <div class="info">
            <div class="titel">${t.titel}</div>
            <div class="zeit">${t.von} – ${t.bis} Uhr</div>
          </div>
          ${laeuft ? '<span class="badge">Läuft</span>' : ''}
        </div>`;
    }).join('') + (rest > 0 ? `<div id="mehr">+ ${rest} weitere${rest === 1 ? 'r' : ''} Termin${rest === 1 ? '' : 'e'} heute</div>` : '');
  } catch (e) {
    document.getElementById('inhalt').innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
  }
}

laden();
setInterval(laden, 60000);
</script>
</body>
</html>
