<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wegweiser</title>
<style>
  :root {
    --markenrot: #EB003C;
    --markenblau: #000548;
    --markenblau-hell: #6084bf;
    --grau: #f0f0f0;
  }
  * { font-family: 'Maven Johanniter', Tahoma, Arial, sans-serif; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--markenblau); height: 100%; overflow: hidden; }
  body { padding: 3vh 3vw; display: flex; flex-direction: column; position: relative; }

  #schraege {
    position: absolute; top: -100%; right: -18vw; width: 45vw; height: 300%;
    background: var(--markenrot); transform: rotate(21.26deg); opacity: 0.13; z-index: 0; pointer-events: none;
  }

  #kopfzeile { display: flex; align-items: center; gap: 3vw; padding: 0 2.8vw 1.6vh; margin-bottom: 1vh; border-bottom: 0.3vh solid var(--markenrot); position: relative; z-index: 1; }
  #kopfzeile span:first-child { font-size: 2.4vh; font-weight: 700; color: var(--markenblau); text-transform: uppercase; letter-spacing: 1px; min-width: 20vw; }
  #kopfzeile .veranst-kopf { font-size: 2.4vh; font-weight: 700; color: var(--markenblau); text-transform: uppercase; letter-spacing: 1px; }

  #inhalt { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; z-index: 1; }
  #leer { color: #b8bccb; font-size: 3.2vh; font-weight: 600; text-align: center; margin-top: 20%; }

  .kachel {
    display: flex; align-items: center; gap: 2.2vw;
    background: #ffffff; border: 1px solid #ececf3;
    box-shadow: 0 0.6vh 1.6vh rgba(0,5,72,0.09);
    border-radius: 1.8vh; padding: 2vh 2.4vw; margin-bottom: 1.8vh; flex-shrink: 0;
  }
  .kachel.laeuft { box-shadow: 0 0.6vh 1.8vh rgba(23,168,119,0.22); border-color: #b7ecd8; }

  .chip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 12vw; height: 9.5vh; border-radius: 1.4vh; flex-shrink: 0;
    background: linear-gradient(155deg, var(--markenrot), #c40033);
  }
  .kachel.laeuft .chip { background: linear-gradient(155deg, #1dbf82, #128a5c); }
  .chip .raum { font-size: 3.9vh; font-weight: 700; color: #ffffff; line-height: 1; }
  .chip .stock { font-size: 2.1vh; font-weight: 600; color: rgba(255,255,255,0.9); margin-top: 0.6vh; }

  .info { flex: 1; min-width: 0; }
  .titel { font-size: 3.6vh; font-weight: 700; color: var(--markenblau); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zeit { font-size: 2.6vh; font-weight: 600; color: var(--markenblau-hell); margin-top: 0.5vh; }

  .badge { display: flex; align-items: center; gap: 0.9vh; font-size: 2vh; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.8vh 1.8vh; border-radius: 20px; background: #e3faf1; color: #128a5c; flex-shrink: 0; }
  .badge .punkt { width: 1.3vh; height: 1.3vh; border-radius: 50%; background: #17a877; animation: puls 1.4s ease-in-out infinite; }
  @keyframes puls { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

  #mehr { font-size: 2.3vh; color: var(--markenblau-hell); text-align: center; padding: 1vh; font-weight: 600; }
</style>
</head>
<body>
  <div id="schraege"></div>
  <div id="kopfzeile">
    <span>Raum</span>
    <span class="veranst-kopf">Veranstaltung</span>
  </div>
  <div id="inhalt"></div>

<script>
const SIGNAGE_URL = "https://raw.githubusercontent.com/jo-sides/raumbuchung/main/signage.json";

function heuteDatum() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function minJetzt() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function minVon(uhrzeit) {
  const [h,m] = uhrzeit.split(':').map(Number);
  return h*60+m;
}

async function laden() {
  try {
    const res = await fetch(SIGNAGE_URL + "?t=" + Date.now());
    const alle = await res.json();
    const heute = heuteDatum();
    const jetzt = minJetzt();
    const alleTermine = alle
      .filter(t => t.datum === heute && minVon(t.bis) > jetzt)
      .sort((a,b) => minVon(a.von) - minVon(b.von));

    const MAX_KACHELN = 3; // fest statt gemessen — zuverlässig unabhängig von der iframe-Einbettung
    const termine = alleTermine.slice(0, MAX_KACHELN);
    const rest = alleTermine.length - termine.length;

    const inhalt = document.getElementById('inhalt');
    document.getElementById('kopfzeile').style.display = termine.length ? 'flex' : 'none';
    if (termine.length === 0) {
      inhalt.innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
      return;
    }
    inhalt.innerHTML = termine.map(t => {
      const laeuft = minVon(t.von) <= jetzt && jetzt < minVon(t.bis);
      return `
        <div class="kachel ${laeuft ? 'laeuft' : ''}">
          <div class="chip">
            <span class="raum">${t.kuerzel}</span>
            <span class="stock">${t.pfeil} ${t.stock}</span>
          </div>
          <div class="info">
            <div class="titel">${t.titel}</div>
            <div class="zeit">${t.von} – ${t.bis} Uhr</div>
          </div>
          ${laeuft ? '<span class="badge"><span class="punkt"></span>Läuft</span>' : ''}
        </div>`;
    }).join('') + (rest > 0 ? `<div id="mehr">+ ${rest} weitere${rest === 1 ? 'r' : ''} Termin${rest === 1 ? '' : 'e'} heute</div>` : '');
  } catch (e) {
    document.getElementById('inhalt').innerHTML = '<div id="leer">Keine bevorstehenden Termine geplant</div>';
  }
}

laden();
setInterval(laden, 60000);
</script>
</body>
</html>
