<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raumbuchung Johanniter Bergstraße-Pfalz</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f2; margin: 0; padding: 20px; color: #1a1a1a; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  p.sub { color: #555; margin: 0 0 16px; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  select, button { font-size: 14px; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  button { cursor: pointer; }
  #dayLabel { font-weight: bold; min-width: 160px; text-align: center; }
  #status { font-size: 12px; color: #888; margin-bottom: 10px; }

  #kalender { display: flex; background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: visible; }
  .zeitachse { width: 46px; flex-shrink: 0; border-right: 1px solid #ddd; }
  .zeitachseKopf { height: 33px; box-sizing: border-box; border-bottom: 1px solid #ddd; }
  .zeitachseKoerper { position: relative; }
  .zeitachse .marke { position: absolute; left: 0; right: 0; font-size: 10px; color: #999; transform: translateY(-50%); text-align: right; padding-right: 4px; box-sizing: border-box; }
  .spalten { flex: 1; display: flex; }
  .raumKopf { text-align: center; font-weight: bold; font-size: 12px; padding: 9px 4px; box-sizing: border-box; height: 33px; border-bottom: 1px solid #ddd; border-left: 1px solid #eee; background: #f8f6f4; position: relative; }
  .infoIcon { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #ccc; color: #fff; font-size: 10px; line-height: 14px; text-align: center; margin-left: 4px; cursor: pointer; font-weight: normal; }
  .infoBox { display: none; position: absolute; top: 32px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; font-size: 11px; font-weight: normal; text-align: left; width: 180px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); z-index: 5; color: #333; }
  .infoBox.offen { display: block; }
  .raumSpalte { flex: 1; position: relative; border-left: 1px solid #eee; background-image: repeating-linear-gradient(to bottom, transparent, transparent 59px, #f0f0ee 59px, #f0f0ee 60px); cursor: crosshair; }
  .kopfZeile { display: flex; }
  .kopfZeile .raumKopf { flex: 1; }

  .block { position: absolute; left: 2px; right: 2px; border-radius: 4px; font-size: 11px; padding: 3px 5px; box-sizing: border-box; overflow: hidden; }
  .belegt { background: #c1121f; color: #fff; }
  .angefragt { background: #f9a825; color: #3a2a00; }
  .neu { background: #ffb199; border: 1px dashed #c1121f; color: #5a1200; pointer-events: none; }

  #overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 10; }
  #modal { background: #fff; border-radius: 10px; padding: 20px; width: 300px; }
  #modal input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  #modal .row { display: flex; gap: 8px; }
  #modal button { flex: 1; }
  #err { color: #b3261e; font-size: 12px; display: none; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>Raumbelegung Johanniter Bergstraße-Pfalz</h1>
  <p class="sub">Auf einen freien Bereich klicken und ziehen, um eine Raumanfrage zu stellen — 15-Minuten-genau.</p>

  <div class="toolbar">
    <select id="standortSelect"></select>
    <button id="prevDay">←</button>
    <span id="dayLabel"></span>
    <button id="nextDay">→</button>
  </div>
  <div id="status">Lade Daten…</div>

  <div id="kalender">
    <div class="zeitachse">
      <div class="zeitachseKopf"></div>
      <div class="zeitachseKoerper" id="zeitachse"></div>
    </div>
    <div style="flex:1">
      <div class="kopfZeile" id="kopfZeile"></div>
      <div class="spalten" id="spalten"></div>
    </div>
  </div>

  <div id="overlay">
    <div id="modal">
      <div style="font-weight:bold; margin-bottom:2px" id="mRaum"></div>
      <div style="font-size:12px; color:#555; margin-bottom:10px" id="mZeit"></div>
      <select id="fAbteilung">
        <option value="">Abteilung wählen…</option>
        <option>Ambulante Pflege</option>
        <option>Ausbildung</option>
        <option>Rettungsdienst</option>
        <option>Rettungsdienstschule</option>
        <option>Hausnotruf</option>
        <option>Fahrdienst</option>
        <option>Kinder- und Jugendhilfe</option>
        <option>Jugend</option>
        <option>Ehrenamt</option>
        <option>Zentrale</option>
        <option>Verwaltung</option>
        <option>BGM</option>
        <option>MAV</option>
        <option>QM</option>
      </select>
      <input id="fVeranstaltung" placeholder="Veranstaltung">
      <input id="fTeilnehmer" type="number" min="0" placeholder="Anzahl Teilnehmende (optional)">
      <textarea id="fBemerkung" placeholder="Bemerkung — wird noch etwas benötigt? Flipchart, Beamer & Co.?" rows="2" style="width:100%; box-sizing:border-box; margin-bottom:8px; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; font-size:14px;"></textarea>
      <div id="err">Bitte Abteilung und Veranstaltung angeben.</div>
      <div class="row">
        <button id="fCancel">Abbrechen</button>
        <button id="fSend" style="background:#c1121f;color:#fff;border-color:#c1121f">Anfrage senden</button>
      </div>
    </div>
  </div>

<script>
const OWNER = "jo-sides";
const REPO = "raumbuchung";
const TOKEN_ENC = "Vzd4VEZwdE1ONEtUNFFMQ3EyUDdLQmsyMEdiWVoyak1yMEdhR2p3T2drUFVOc21QZ1N1ZHlHTDlmblhfWXZhVmM4QWgxcXMwMFlKWjRIVkIxMV90YXBfYnVodGln";
function getToken() { return atob(TOKEN_ENC).split('').reverse().join(''); }
const TOKEN = getToken();
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/public.json`;

const RAEUME = {
  "Viernheim": ["Seminarraum 1", "Seminarraum 2", "Seminarraum 4", "Seminarraum 5", "Werkstraße"],
  "Ludwigshafen-Ruchheim": ["Seminarraum 1", "Seminarraum 2", "Seminarraum 3"],
  "Speyer": ["Seminarraum"],
  "Frankenthal": ["Seminarraum"]
};

const RAUM_HINWEISE = {
  "Viernheim|Seminarraum 5": "Max. 18 Personen (Brandschutz, Obergeschoss)"
};

const TAG_START = 7 * 60;   // 07:00 in Minuten
const TAG_ENDE = 20 * 60;   // 20:00 in Minuten
const PX_PRO_MIN = 1;       // 1 Minute = 1 Pixel
const RASTER = 15;          // Minuten-Raster
const PADDING = 14;         // Luft oben/unten, damit 07:00 und 20:00 nicht abgeschnitten wirken
const HOEHE_INNEN = (TAG_ENDE - TAG_START) * PX_PRO_MIN;
const HOEHE = HOEHE_INNEN + PADDING * 2;

let aktuellerStandort = "Viernheim";
let aktuellesDatum = new Date();
let buchungen = [];
let ziehend = false, ziehRaum = null, ziehStartY = 0, ziehAktY = 0;

function fmtDatum(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const t = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${t}`;
}
function fmtLabel(d) { return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'long', year: 'numeric' }); }
function minZuUhrzeit(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0');
}
function uhrzeitZuMin(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));
}
function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p1) => String.fromCharCode('0x'+p1)));
}

async function ladeDaten() {
  document.getElementById('status').textContent = "Lade Daten…";
  const res = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" } });
  const json = await res.json();
  buchungen = JSON.parse(b64DecodeUnicode(json.content));
  document.getElementById('status').textContent = buchungen.length + " Buchungen geladen — Stand: " + new Date().toLocaleTimeString('de-DE');
  render();
}

async function speichereNeueBuchung(neu) {
  const res = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" } });
  const json = await res.json();
  const liste = JSON.parse(b64DecodeUnicode(json.content));
  liste.push(neu);
  const contentB64 = b64EncodeUnicode(JSON.stringify(liste, null, 2));
  const putRes = await fetch(API, {
    method: "PUT",
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `Anfrage: ${neu.raum} am ${neu.datum}`, content: contentB64, sha: json.sha })
  });
  return putRes.ok;
}

function initStandortSelect() {
  const sel = document.getElementById('standortSelect');
  Object.keys(RAEUME).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  sel.value = aktuellerStandort;
  sel.addEventListener('change', () => { aktuellerStandort = sel.value; render(); });
}

function renderZeitachse() {
  const achse = document.getElementById('zeitachse');
  achse.style.height = HOEHE + "px";
  achse.innerHTML = "";
  for (let m = TAG_START; m <= TAG_ENDE; m += 60) {
    const marke = document.createElement('div');
    marke.className = "marke";
    marke.style.top = (PADDING + (m - TAG_START) * PX_PRO_MIN) + "px";
    marke.textContent = minZuUhrzeit(m);
    achse.appendChild(marke);
  }
}

function render() {
  document.getElementById('dayLabel').textContent = fmtLabel(aktuellesDatum);
  const raeume = RAEUME[aktuellerStandort];
  const datumStr = fmtDatum(aktuellesDatum);

  renderZeitachse();

  const kopf = document.getElementById('kopfZeile');
  kopf.innerHTML = "";
  raeume.forEach(r => {
    const d = document.createElement('div');
    d.className = "raumKopf";
    const hinweis = RAUM_HINWEISE[aktuellerStandort + "|" + r];
    d.innerHTML = r + (hinweis ? ` <span class="infoIcon">i</span><div class="infoBox">${hinweis}</div>` : "");
    if (hinweis) {
      const icon = d.querySelector('.infoIcon');
      const box = d.querySelector('.infoBox');
      icon.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.infoBox.offen').forEach(b => { if (b !== box) b.classList.remove('offen'); });
        box.classList.toggle('offen');
      });
    }
    kopf.appendChild(d);
  });

  const spalten = document.getElementById('spalten');
  spalten.innerHTML = "";
  raeume.forEach(raum => {
    const spalte = document.createElement('div');
    spalte.className = "raumSpalte";
    spalte.style.height = HOEHE + "px";
    spalte.dataset.raum = raum;

    buchungen
      .filter(b => b.standort === aktuellerStandort && b.raum === raum && b.datum === datumStr)
      .forEach(b => {
        const start = uhrzeitZuMin(b.von), ende = uhrzeitZuMin(b.bis);
        const block = document.createElement('div');
        block.className = "block " + (b.status === "angefragt" ? "angefragt" : "belegt");
        block.style.top = (PADDING + (start - TAG_START) * PX_PRO_MIN) + "px";
        block.style.height = Math.max((ende - start) * PX_PRO_MIN - 2, 14) + "px";
        block.textContent = b.von + "–" + b.bis + (b.abteilung ? " · " + b.abteilung : "");
        block.title = `${b.von}–${b.bis} (${b.status})` + (b.abteilung ? ` — ${b.abteilung}: ${b.veranstaltung || ''}` : '');
        spalte.appendChild(block);
      });

    spalte.addEventListener('mousedown', (e) => {
      const rect = spalte.getBoundingClientRect();
      ziehend = true; ziehRaum = raum;
      ziehStartY = Math.max(0, Math.min(HOEHE_INNEN, e.clientY - rect.top - PADDING));
      ziehAktY = ziehStartY;
      zeichneVorschau(spalte);
    });
    spalte.addEventListener('mousemove', (e) => {
      if (!ziehend || spalte.dataset.raum !== ziehRaum) return;
      const rect = spalte.getBoundingClientRect();
      ziehAktY = Math.max(0, Math.min(HOEHE_INNEN, e.clientY - rect.top - PADDING));
      zeichneVorschau(spalte);
    });
    window.addEventListener('mouseup', () => {
      if (!ziehend) return;
      ziehend = false;
      const vorschau = document.getElementById('vorschauBlock');
      if (vorschau) {
        const lo = Math.min(ziehStartY, ziehAktY), hi = Math.max(ziehStartY, ziehAktY);
        if (hi - lo >= RASTER * PX_PRO_MIN) {
          oeffneModal(ziehRaum, lo, hi);
        } else {
          vorschau.remove();
        }
      }
    });

    spalten.appendChild(spalte);
  });
}

function schnappen(y) {
  const minuten = y / PX_PRO_MIN;
  return Math.round(minuten / RASTER) * RASTER;
}

function zeichneVorschau(spalte) {
  let vorschau = document.getElementById('vorschauBlock');
  if (!vorschau) {
    vorschau = document.createElement('div');
    vorschau.id = "vorschauBlock";
    vorschau.className = "block neu";
    spalte.appendChild(vorschau);
  }
  const lo = Math.min(ziehStartY, ziehAktY), hi = Math.max(ziehStartY, ziehAktY);
  const startMin = TAG_START + schnappen(lo);
  const endeMin = TAG_START + schnappen(hi);
  vorschau.style.top = (PADDING + schnappen(lo)) + "px";
  vorschau.style.height = Math.max(schnappen(hi) - schnappen(lo) - 2, 4) + "px";
  vorschau.textContent = minZuUhrzeit(startMin) + "–" + minZuUhrzeit(endeMin);
}

let aktRaum = null, aktVon = null, aktBis = null;

function oeffneModal(raum, lo, hi) {
  const startMin = TAG_START + schnappen(lo);
  const endeMin = TAG_START + schnappen(hi);
  aktRaum = raum; aktVon = minZuUhrzeit(startMin); aktBis = minZuUhrzeit(endeMin);
  document.getElementById('mRaum').textContent = `${aktuellerStandort} – ${raum}`;
  document.getElementById('mZeit').textContent = `${fmtLabel(aktuellesDatum)}, ${aktVon}–${aktBis}`;
  document.getElementById('overlay').style.display = "flex";
}

document.getElementById('fCancel').onclick = () => {
  document.getElementById('overlay').style.display = "none";
  const v = document.getElementById('vorschauBlock');
  if (v) v.remove();
};
document.getElementById('fSend').onclick = async () => {
  const abteilung = document.getElementById('fAbteilung').value;
  const veranstaltung = document.getElementById('fVeranstaltung').value.trim();
  const teilnehmer = document.getElementById('fTeilnehmer').value;
  const bemerkung = document.getElementById('fBemerkung').value.trim();
  if (!abteilung || !veranstaltung) { document.getElementById('err').style.display = "block"; return; }
  document.getElementById('err').style.display = "none";
  const neu = {
    id: "b_" + fmtDatum(aktuellesDatum) + "_" + aktRaum.replace(/\s+/g,'') + "_" + Date.now(),
    standort: aktuellerStandort,
    raum: aktRaum,
    datum: fmtDatum(aktuellesDatum),
    von: aktVon,
    bis: aktBis,
    status: "angefragt",
    abteilung: abteilung,
    veranstaltung: veranstaltung,
    teilnehmer: teilnehmer ? parseInt(teilnehmer) : null,
    bemerkung: bemerkung
  };
  document.getElementById('fSend').textContent = "Sende…";
  await speichereNeueBuchung(neu);
  document.getElementById('fSend').textContent = "Anfrage senden";
  document.getElementById('overlay').style.display = "none";
  document.getElementById('fAbteilung').value = "";
  document.getElementById('fVeranstaltung').value = "";
  document.getElementById('fTeilnehmer').value = "";
  document.getElementById('fBemerkung').value = "";
  await ladeDaten();
};

document.getElementById('prevDay').onclick = () => { aktuellesDatum.setDate(aktuellesDatum.getDate()-1); render(); };
document.getElementById('nextDay').onclick = () => { aktuellesDatum.setDate(aktuellesDatum.getDate()+1); render(); };

initStandortSelect();
ladeDaten();
document.addEventListener('click', () => {
  document.querySelectorAll('.infoBox.offen').forEach(b => b.classList.remove('offen'));
});
</script>
</body>
</html>
