<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raumbuchung Johanniter Bergstraße-Pfalz</title>
<style>
  :root {
    --markenrot: #EB003C;
    --markenrot-hover: #c40033;
    --markenblau: #000548;
    --markenblau-hell: #6084bf;
    --markenweiss: #ffffff;
    --grau: #f0f0f0;
    --signalgelb: #DEFF00;
    --orange: #f4b00a;
    --orange-hell: #fae5c8;
  }
  * { font-family: 'Maven Johanniter', Tahoma, Arial, sans-serif; }
  body { margin: 0; background: var(--markenweiss); color: var(--markenblau); }

  header { position: relative; background: var(--markenblau); overflow: hidden; padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  header::after {
    content: ""; position: absolute; top: -40%; right: -6%; width: 220px; height: 220%;
    background: var(--markenrot); transform: rotate(21.26deg); opacity: 0.9;
  }
  header img { height: 34px; position: relative; z-index: 1; }
  header h1 { font-size: 22px; font-weight: 700; color: var(--markenweiss); margin: 0; position: relative; z-index: 1; letter-spacing: 0.2px; }

  main { max-width: 1100px; margin: 0 auto; padding: 22px 24px 40px; }
  p.sub { color: var(--markenblau-hell); margin: 0 0 18px; font-size: 14px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  select, button.nav {
    font-size: 14px; padding: 9px 14px; border: 1.5px solid var(--markenblau); border-radius: 8px;
    background: var(--markenweiss); color: var(--markenblau); font-weight: 500; cursor: pointer;
  }
  button.nav:hover { background: var(--markenblau); color: var(--markenweiss); }
  #dayLabel { font-weight: 700; min-width: 190px; text-align: center; font-size: 15px; }
  #status { font-size: 12px; color: var(--markenblau-hell); margin-bottom: 12px; }

  .legende { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; font-size: 12px; color: var(--markenblau); }
  .legende .punkt { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  #kalender { display: flex; background: var(--markenweiss); border: 1.5px solid var(--grau); border-radius: 12px; overflow: visible; box-shadow: 0 2px 10px rgba(0,5,72,0.06); }
  .zeitachse { width: 50px; flex-shrink: 0; border-right: 1.5px solid var(--grau); }
  .zeitachseKopf { height: 38px; box-sizing: border-box; border-bottom: 1.5px solid var(--grau); border-radius: 12px 0 0 0; }
  .zeitachseKoerper { position: relative; }
  .zeitachse .marke { position: absolute; left: 0; right: 0; font-size: 10.5px; color: var(--markenblau-hell); transform: translateY(-50%); text-align: right; padding-right: 6px; box-sizing: border-box; font-weight: 500; }
  .spalten { flex: 1; display: flex; }
  .raumKopf {
    text-align: center; font-weight: 700; font-size: 12.5px; padding: 10px 4px; box-sizing: border-box;
    height: 38px; border-bottom: 1.5px solid var(--grau); border-left: 1px solid var(--grau);
    background: var(--grau); color: var(--markenblau); position: relative;
  }
  .infoIcon { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--markenblau-hell); color: #fff; font-size: 10px; line-height: 14px; text-align: center; margin-left: 4px; cursor: pointer; font-weight: normal; }
  .infoBox { display: none; position: absolute; top: 36px; left: 50%; transform: translateX(-50%); background: var(--markenweiss); border: 1px solid var(--grau); border-radius: 8px; padding: 9px 11px; font-size: 11px; font-weight: normal; text-align: left; width: 180px; box-shadow: 0 4px 12px rgba(0,5,72,0.15); z-index: 5; color: var(--markenblau); }
  .infoBox.offen { display: block; }
  .raumSpalte { flex: 1; position: relative; border-left: 1px solid var(--grau); background-image: repeating-linear-gradient(to bottom, transparent, transparent 59px, #f7f7f7 59px, #f7f7f7 60px); cursor: crosshair; }
  .kopfZeile { display: flex; }
  .kopfZeile .raumKopf { flex: 1; }
  .kopfZeile .raumKopf:last-child { border-radius: 0 12px 0 0; }

  .block {
    position: absolute; left: 3px; right: 3px; border-radius: 8px; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 2px 4px; gap: 2px;
  }
  .zeit-label { font-size: 13px; font-weight: 700; line-height: 1.15; }
  .veranst-label { font-size: 13px; font-weight: 700; line-height: 1.15; }
  .zeit-klein { font-size: 10.5px; font-weight: 500; opacity: 0.85; line-height: 1.1; }
  .status-badge { font-size: 9.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 1px 6px; border-radius: 20px; }
  .belegt { background: var(--markenrot); color: var(--markenweiss); }
  .belegt .status-badge { background: rgba(255,255,255,0.25); color: var(--markenweiss); }
  .angefragt { background: var(--orange-hell); color: #7a4a00; border: 1.5px solid var(--orange); }
  .angefragt .status-badge { background: var(--orange); color: #4a2d00; }
  .neu { background: var(--signalgelb); border: 1.5px dashed var(--markenrot); color: var(--markenblau); pointer-events: none; }
  .neu .zeit-label { font-size: 13px; }

  #overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,5,72,0.55); align-items: center; justify-content: center; z-index: 10; }
  #modal { background: var(--markenweiss); border-radius: 14px; padding: 22px; width: 320px; box-shadow: 0 10px 30px rgba(0,5,72,0.3); }
  #modal #mRaum { font-weight: 700; font-size: 16px; color: var(--markenblau); margin-bottom: 2px; }
  #modal #mZeit { font-size: 12.5px; color: var(--markenblau-hell); margin-bottom: 14px; }
  #modal select, #modal input, #modal textarea {
    width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 9px 10px; border: 1.5px solid var(--grau);
    border-radius: 8px; font-size: 14px; color: var(--markenblau); font-family: inherit;
  }
  #modal select:focus, #modal input:focus, #modal textarea:focus { outline: none; border-color: var(--markenblau-hell); }
  #modal .row { display: flex; gap: 10px; margin-top: 4px; }
  #modal button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--markenblau); background: var(--markenweiss); color: var(--markenblau); }
  #modal button:hover { background: var(--markenblau); color: var(--markenweiss); }
  #fSend { background: var(--markenrot) !important; border-color: var(--markenrot) !important; color: var(--markenweiss) !important; }
  #fSend:hover { background: var(--markenrot-hover) !important; border-color: var(--markenrot-hover) !important; }
  #err { color: var(--markenrot); font-size: 12px; display: none; margin-bottom: 8px; }
</style>
</head>

<script>
const OWNER = "jo-sides";
const REPO = "raumbuchung";
const TOKEN_ENC = "Vzd4VEZwdE1ONEtUNFFMQ3EyUDdLQmsyMEdiWVoyak1yMEdhR2p3T2drUFVOc21QZ1N1ZHlHTDlmblhfWXZhVmM4QWgxcXMwMFlKWjRIVkIxMV90YXBfYnVodGln";
function getToken() { return atob(TOKEN_ENC).split('').reverse().join(''); }
const TOKEN = getToken();
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/public.json`;

const RAEUME = {
  "Viernheim": ["Seminarraum 1", "Seminarraum 2", "Seminarraum 4", "Seminarraum 5", "Seminarraum 6", "Werkstraße"],
  "Ludwigshafen-Ruchheim": ["Seminarraum 1", "Seminarraum 2", "Seminarraum 3"],
  "Speyer": ["Seminarraum"],
  "Frankenthal": ["Seminarraum"]
};

const RAUM_HINWEISE = {
  "Viernheim|Seminarraum 5": "Max. 18 Personen (Brandschutz, Obergeschoss)"
};

const TAG_START = 7 * 60;
const TAG_ENDE = 20 * 60;
const PX_PRO_MIN = 1;
const RASTER = 15;
const PADDING = 14;
const HOEHE_INNEN = (TAG_ENDE - TAG_START) * PX_PRO_MIN;
const HOEHE = HOEHE_INNEN + PADDING * 2;

let aktuellerStandort = "Viernheim";
let aktuellesDatum = new Date();
let buchungen = [];
let ziehend = false, ziehRaum = null, ziehStartY = 0, ziehAktY = 0;

function fmtDatum(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const t = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${t}`;
}
function fmtLabel(d) { return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'long', year: 'numeric' }); }
function minZuUhrzeit(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0');
}
function uhrzeitZuMin(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));
}
function b64EncodeUnicode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p1) => String.fromCharCode('0x'+p1)));
}

async function ladeDaten() {
  document.getElementById('status').textContent = "Lade Daten…";
  const res = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" } });
  const json = await res.json();
  buchungen = JSON.parse(b64DecodeUnicode(json.content));
  document.getElementById('status').textContent = buchungen.length + " Buchungen geladen — Stand: " + new Date().toLocaleTimeString('de-DE');
  render();
}

async function speichereNeueBuchung(neu) {
  const res = await fetch(API, { headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" } });
  const json = await res.json();
  const liste = JSON.parse(b64DecodeUnicode(json.content));
  liste.push(neu);
  const contentB64 = b64EncodeUnicode(JSON.stringify(liste, null, 2));
  const putRes = await fetch(API, {
    method: "PUT",
    headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `Anfrage: ${neu.raum} am ${neu.datum}`, content: contentB64, sha: json.sha })
  });
  return putRes.ok;
}

function initStandortSelect() {
  const sel = document.getElementById('standortSelect');
  Object.keys(RAEUME).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  sel.value = aktuellerStandort;
  sel.addEventListener('change', () => { aktuellerStandort = sel.value; render(); });
}

function renderZeitachse() {
  const achse = document.getElementById('zeitachse');
  achse.style.height = HOEHE + "px";
  achse.innerHTML = "";
  for (let m = TAG_START; m <= TAG_ENDE; m += 60) {
    const marke = document.createElement('div');
    marke.className = "marke";
    marke.style.top = (PADDING + (m - TAG_START) * PX_PRO_MIN) + "px";
    marke.textContent = minZuUhrzeit(m);
    achse.appendChild(marke);
  }
}

function render() {
  document.getElementById('dayLabel').textContent = fmtLabel(aktuellesDatum);
  const raeume = RAEUME[aktuellerStandort];
  const datumStr = fmtDatum(aktuellesDatum);

  renderZeitachse();

  const kopf = document.getElementById('kopfZeile');
  kopf.innerHTML = "";
  raeume.forEach(r => {
    const d = document.createElement('div');
    d.className = "raumKopf";
    const hinweis = RAUM_HINWEISE[aktuellerStandort + "|" + r];
    d.innerHTML = r + (hinweis ? ` <span class="infoIcon">i</span><div class="infoBox">${hinweis}</div>` : "");
    if (hinweis) {
      const icon = d.querySelector('.infoIcon');
      const box = d.querySelector('.infoBox');
      icon.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.infoBox.offen').forEach(b => { if (b !== box) b.classList.remove('offen'); });
        box.classList.toggle('offen');
      });
    }
    kopf.appendChild(d);
  });

  const spalten = document.getElementById('spalten');
  spalten.innerHTML = "";
  raeume.forEach(raum => {
    const spalte = document.createElement('div');
    spalte.className = "raumSpalte";
    spalte.style.height = HOEHE + "px";
    spalte.dataset.raum = raum;

    buchungen
      .filter(b => b.standort === aktuellerStandort && b.raum === raum && b.datum === datumStr)
      .forEach(b => {
        const start = uhrzeitZuMin(b.von), ende = uhrzeitZuMin(b.bis);
        const istAngefragt = b.status === "angefragt";
        const block = document.createElement('div');
        block.className = "block " + (istAngefragt ? "angefragt" : "belegt");
        block.style.top = (PADDING + (start - TAG_START) * PX_PRO_MIN) + "px";
        block.style.height = Math.max((ende - start) * PX_PRO_MIN - 2, 40) + "px";
        block.innerHTML = `<span class="veranst-label">${b.veranstaltung || '—'}</span><span class="zeit-klein">${b.von}–${b.bis}</span><span class="status-badge">${istAngefragt ? "Angefragt" : "Genehmigt"}</span>`;
        block.title = `${b.veranstaltung || ''} (${b.von}–${b.bis}, ${istAngefragt ? "Angefragt" : "Genehmigt"})` + (b.abteilung ? ` — ${b.abteilung}` : '');
        spalte.appendChild(block);
      });

    spalte.addEventListener('mousedown', (e) => {
      const rect = spalte.getBoundingClientRect();
      ziehend = true; ziehRaum = raum;
      ziehStartY = Math.max(0, Math.min(HOEHE_INNEN, e.clientY - rect.top - PADDING));
      ziehAktY = ziehStartY;
      zeichneVorschau(spalte);
    });
    spalte.addEventListener('mousemove', (e) => {
      if (!ziehend || spalte.dataset.raum !== ziehRaum) return;
      const rect = spalte.getBoundingClientRect();
      ziehAktY = Math.max(0, Math.min(HOEHE_INNEN, e.clientY - rect.top - PADDING));
      zeichneVorschau(spalte);
    });
    window.addEventListener('mouseup', () => {
      if (!ziehend) return;
      ziehend = false;
      const vorschau = document.getElementById('vorschauBlock');
      if (vorschau) {
        const lo = Math.min(ziehStartY, ziehAktY), hi = Math.max(ziehStartY, ziehAktY);
        if (hi - lo >= RASTER * PX_PRO_MIN) {
          oeffneModal(ziehRaum, lo, hi);
        } else {
          vorschau.remove();
        }
      }
    });

    spalten.appendChild(spalte);
  });
}

function schnappen(y) {
  const minuten = y / PX_PRO_MIN;
  return Math.round(minuten / RASTER) * RASTER;
}

function zeichneVorschau(spalte) {
  let vorschau = document.getElementById('vorschauBlock');
  if (!vorschau) {
    vorschau = document.createElement('div');
    vorschau.id = "vorschauBlock";
    vorschau.className = "block neu";
    spalte.appendChild(vorschau);
  }
  const lo = Math.min(ziehStartY, ziehAktY), hi = Math.max(ziehStartY, ziehAktY);
  const startMin = TAG_START + schnappen(lo);
  const endeMin = TAG_START + schnappen(hi);
  vorschau.style.top = (PADDING + schnappen(lo)) + "px";
  vorschau.style.height = Math.max(schnappen(hi) - schnappen(lo) - 2, 4) + "px";
  vorschau.innerHTML = `<span class="zeit-label">${minZuUhrzeit(startMin)}–${minZuUhrzeit(endeMin)}</span>`;
}

let aktRaum = null, aktVon = null, aktBis = null;

function oeffneModal(raum, lo, hi) {
  const startMin = TAG_START + schnappen(lo);
  const endeMin = TAG_START + schnappen(hi);
  aktRaum = raum; aktVon = minZuUhrzeit(startMin); aktBis = minZuUhrzeit(endeMin);
  document.getElementById('mRaum').textContent = `${aktuellerStandort} – ${raum}`;
  document.getElementById('mZeit').textContent = `${fmtLabel(aktuellesDatum)}, ${aktVon}–${aktBis}`;
  document.getElementById('overlay').style.display = "flex";
}

document.getElementById('fCancel').onclick = () => {
  document.getElementById('overlay').style.display = "none";
  const v = document.getElementById('vorschauBlock');
  if (v) v.remove();
};
document.getElementById('fSend').onclick = async () => {
  const abteilung = document.getElementById('fAbteilung').value;
  const veranstaltung = document.getElementById('fVeranstaltung').value.trim();
  const teilnehmer = document.getElementById('fTeilnehmer').value;
  const bemerkung = document.getElementById('fBemerkung').value.trim();
  if (!abteilung || !veranstaltung) { document.getElementById('err').style.display = "block"; return; }
  document.getElementById('err').style.display = "none";
  const neu = {
    id: "b_" + fmtDatum(aktuellesDatum) + "_" + aktRaum.replace(/\s+/g,'') + "_" + Date.now(),
    standort: aktuellerStandort,
    raum: aktRaum,
    datum: fmtDatum(aktuellesDatum),
    von: aktVon,
    bis: aktBis,
    status: "angefragt",
    abteilung: abteilung,
    veranstaltung: veranstaltung,
    teilnehmer: teilnehmer ? parseInt(teilnehmer) : null,
    bemerkung: bemerkung
  };
  document.getElementById('fSend').textContent = "Sende…";
  await speichereNeueBuchung(neu);
  document.getElementById('fSend').textContent = "Anfrage senden";
  document.getElementById('overlay').style.display = "none";
  document.getElementById('fAbteilung').value = "";
  document.getElementById('fVeranstaltung').value = "";
  document.getElementById('fTeilnehmer').value = "";
  document.getElementById('fBemerkung').value = "";
  await ladeDaten();
};

document.getElementById('prevDay').onclick = () => { aktuellesDatum.setDate(aktuellesDatum.getDate()-1); render(); };
document.getElementById('nextDay').onclick = () => { aktuellesDatum.setDate(aktuellesDatum.getDate()+1); render(); };

initStandortSelect();
ladeDaten();
document.addEventListener('click', () => {
  document.querySelectorAll('.infoBox.offen').forEach(b => b.classList.remove('offen'));
});
</script>
</body>
</html>
